apiVersion: apps/v1
kind: Deployment
metadata:
  name: cars-deployment
  namespace: cars
  labels:
    app: cars

spec:
  replicas: 3

  selector:
    matchLabels:
      app: cars

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: cars

    spec:
      containers:
        - name: cars-container
          image: satishpolaka/cars:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          envFrom:
            - configMapRef:
                name: cars-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20