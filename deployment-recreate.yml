apiVersion: apps/v1
kind: Deployment

metadata:
  name: shopping-deployment
  namespace: cars
  labels:
    app: shopping
    version: recreate

spec:
  replicas: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: shopping
      version: recreate

  template:
    metadata:
      labels:
        app: shopping
        version: recreate

    spec:
      containers:
        - name: shopping-container
          image: satishpolaka/shopping:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          envFrom:
            - configMapRef:
                name: cars-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"
